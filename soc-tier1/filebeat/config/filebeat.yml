# Filebeat - Wazuh alerts to Security Onion
filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/ossec/logs/alerts/alerts.json
    json.keys_under_root: true
    json.add_error_key: true
    json.overwrite_keys: true
    fields:
      source: wazuh
    fields_under_root: true

# Optional: also tail archives
  - type: log
    enabled: false
    paths:
      - /var/ossec/logs/archives/archives.json
    json.keys_under_root: true
    json.add_error_key: true
    fields:
      source: wazuh-archives
    fields_under_root: true

processors:
  - drop_fields:
      fields: ["host", "agent.ephemeral_id"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["https://wazuh.indexer:9200"]
  username: "admin"
  password: "admin"
  ssl.verification_mode: none

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat.log
  keepfiles: 7
  permissions: 0644

seccomp:
  default_action: allow
  syscalls:
  - action: allow
    names:
    - rseq
