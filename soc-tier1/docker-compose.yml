# NOTE: network_mode: "host" only works on Linux (Docker Engine).
# It is NOT supported on Docker Desktop for Windows/macOS.
# If running on Windows WSL2 with Docker Engine inside the VM, this works fine.

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    container_name: wazuh.manager
    hostname: wazuh.manager
    network_mode: "host"
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - ./wazuh-manager/config/ossec.conf:/var/ossec/etc/ossec.conf
      - ./wazuh-manager/integrations/custom-thehive:/var/ossec/integrations/custom-thehive
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:${FILEBEAT_VERSION}
    container_name: filebeat
    user: root
    network_mode: "host"
    environment:
      - SECURITY_ONION_HOST=${SECURITY_ONION_HOST}
    volumes:
      - ./filebeat/config/filebeat.yml:/tmp/filebeat_src.yml:ro
      - wazuh-logs:/var/ossec/logs:ro
    entrypoint: [ "/bin/bash", "-c" ]
    command: [ "cp /tmp/filebeat_src.yml /usr/share/filebeat/filebeat.yml && chmod 600 /usr/share/filebeat/filebeat.yml && exec filebeat -e" ]
    depends_on:
      - wazuh.manager
    restart: unless-stopped

  vpn:
    image: linuxserver/wireguard:latest
    container_name: wireguard
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SERVERURL=auto
      - SERVERPORT=51820
      - PEERS=1
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ./vpn/config:/config
      - /lib/modules:/lib/modules
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    network_mode: "host"
    environment:
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - PROXY_SSL=off
      - BACKEND=http://localhost:55000 # wazuh.manager shares host network
    volumes:
      - waf-logs:/var/log
    restart: unless-stopped

volumes:
  wazuh-api-configuration:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:
  wazuh-wodles:
  waf-logs:
