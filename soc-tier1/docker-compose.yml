# Wazuh SOC Tier 1 Stack
# wazuh.manager uses bridge network with explicit port mappings (required for Docker Desktop on Windows)
# filebeat, vpn, waf remain on host network as they need direct host network access

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    container_name: wazuh.manager
    hostname: wazuh.manager
    networks:
      - wazuh-stack
    # Explicit port mappings — exposed on Windows host's ALL network interfaces.
    # Port 55000 (Wazuh API) is omitted here because Windows reserves the 54912-55011
    # range for dynamic ports — bind would fail. The dashboard reaches it via container DNS.
    ports:
      - "0.0.0.0:1514:1514/tcp"   # Agent communication (events)
      - "0.0.0.0:1515:1515/tcp"   # Agent auto-enrollment (authd)
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - ./wazuh-manager/config/ossec.conf:/var/ossec/etc/ossec.conf
      - ./wazuh-manager/integrations/custom-thehive:/var/ossec/integrations/custom-thehive
      - ./wazuh-manager/config/filebeat.yml:/etc/filebeat/filebeat.yml
    restart: unless-stopped



  vpn:
    image: linuxserver/wireguard:latest
    container_name: wireguard
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SERVERURL=auto
      - SERVERPORT=51820
      - PEERS=1
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ./vpn/config:/config
      - /lib/modules:/lib/modules
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    networks:
      - wazuh-stack
    environment:
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - PROXY_SSL=off
      - BACKEND=http://wazuh.manager:55000
    volumes:
      - waf-logs:/var/log
    depends_on:
      - wazuh.manager
    restart: unless-stopped

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_INDEXER_VERSION}
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    networks:
      - wazuh-stack
    environment:
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - wazuh-indexer-logs:/var/log/wazuh-indexer
    depends_on:
      - wazuh.manager
    restart: unless-stopped

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_DASHBOARD_VERSION}
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    networks:
      - wazuh-stack
    ports:
      - "5601:5601"
    environment:
      - WAZUH_API_URL=https://wazuh.manager
      - API_PORT=${WAZUH_API_PORT}
      - API_USERNAME=${WAZUH_UI_USERNAME}
      - API_PASSWORD=${WAZUH_UI_PASSWORD}
      - DASHBOARD_USERNAME=${WAZUH_DASHBOARD_USERNAME}
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD}
    volumes:
      - wazuh-dashboard-data:/usr/share/wazuh-dashboard/data
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    restart: unless-stopped

volumes:
  wazuh-api-configuration:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:
  wazuh-wodles:
  wazuh-indexer-data:
  wazuh-indexer-logs:
  wazuh-dashboard-data:
  waf-logs:

networks:
  wazuh-stack:
    driver: bridge
