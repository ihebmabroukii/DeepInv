version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: security_platform_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: REDACTED
      POSTGRES_DB: security_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
