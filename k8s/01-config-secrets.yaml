# -----------------------------------------------------------------------------
# Shared configuration and secrets for the SOC platform.
# NOTE: values below are PLACEHOLDERS. Replace them before deploying, or (better)
# generate the Secret at deploy time so real credentials never live in git:
#   kubectl -n soc create secret generic soc-secrets \
#     --from-literal=OPENCTI_TOKEN=... --from-literal=CORTEX_API_KEY=... ...
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-config
  namespace: soc
data:
  AI_MODEL_NAME: "mistral:latest"
  OLLAMA_BASE_URL: "http://ollama:11434"
  REDIS_URL: "redis://soc-ai-redis:6379/0"
  WAZUH_API_URL: "https://wazuh-manager:55000"
  THEHIVE_URL: "http://thehive:9000"
  CORTEX_URL: "http://cortex:9001"
  OPENCTI_URL: "http://opencti:8080"
  SO_ELASTIC_URL: "https://security-onion-elastic:9200"
---
apiVersion: v1
kind: Secret
metadata:
  name: soc-secrets
  namespace: soc
type: Opaque
stringData:
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "security_platform"
  WAZUH_API_USER: "wazuh"
  WAZUH_API_PASSWORD: "CHANGE_ME"
  OPENCTI_TOKEN: "CHANGE_ME"
  OPENCTI_ADMIN_EMAIL: "admin@soc.local"
  OPENCTI_ADMIN_PASSWORD: "CHANGE_ME"
  CORTEX_API_KEY: "CHANGE_ME"
  SO_ELASTIC_USER: "so_elastic"
  SO_ELASTIC_PASS: "CHANGE_ME"
  MINIO_ROOT_USER: "opencti"
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
  RABBITMQ_DEFAULT_USER: "opencti"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME"
  THEHIVE_API_KEY: "CHANGE_ME"
