
events {}

http {
    server {
        listen 443 ssl;
        server_name localhost platform.bank.tn;

        # Server Certificate (Identity)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Client CA (Trust Anchor)
        ssl_client_certificate /etc/nginx/certs/root_ca.crt;
        
        # Enable optional verification globally.
        # We enforce "SUCCESS" manually in protected locations.
        ssl_verify_client optional;

        # Location: Health Check - Public
        location /health {
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
        }

        # Location: Bootstrap (Unauthenticated / One-way TLS allowed)
        location /api/v1/agents/bootstrap {
            # No verification check needed here.
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Location: Static Files (Install Scripts) - Public
        location /static/ {
             # Public access to download install.ps1/sh
             proxy_pass http://backend:5000;
             proxy_set_header Host $host;
        }

        # Location: Agent Heartbeat & Tasks (Token-based auth)
        location ~ ^/api/v1/agents/(heartbeat|tasks/result) {
            # Allow token-based authentication for heartbeat
            # Backend will validate the token
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Location: Main API (Strict mTLS)
        location / {
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }
            
            proxy_pass http://backend:5000;
            
            # Pass Trust Headers to Backend
            proxy_set_header Host $host;
            proxy_set_header X-Client-Verified $ssl_client_verify;
            proxy_set_header X-Client-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Serial $ssl_client_serial;
        }
    }
}
