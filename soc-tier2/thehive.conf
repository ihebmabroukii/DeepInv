## Play Framework Secret
play.http.secret.key="changeme_thehive_secret_key_production_CHANGE_THIS_IN_REAL_DEPLOYMENT"

## Database Configuration
db {
  provider: janusgraph
  janusgraph {
    storage {
      backend: cql
      hostname: ["cassandra"]
      cql {
        cluster-name: thp
        keyspace: thehive
      }
    }
    index.search {
      backend: elasticsearch
      hostname: ["thehive-elasticsearch"]
      index-name: thehive
    }
  }
}

## Storage configuration
storage {
  provider: localfs
  localfs.location: /opt/thp/thehive/data
}

## Attachment storage
attachment.storage: localfs

## Service configuration
application.baseUrl: "http://localhost:9000"

## Cortex integration
play.modules.enabled += org.thp.thehive.connector.cortex.CortexModule
cortex {
  servers: [
    {
      name: local
      url: "http://cortex:9001"
      auth {
        type: "bearer"
        key: "y6GvAkyTws0CGI/6Mv7sdNS1iKt0hQO4"
      }
    }
  ]
}

## MISP configuration
play.modules.enabled += org.thp.thehive.connector.misp.MispModule
misp {
  interval: 1m
  servers: [
    {
      name = "local"
      url = "https://misp/" # Internal docker network URL
      auth {
        type = "key"
        key = "BL5A11IZA1J5F597bdRw3MwTnckcrQjUCeITn2iM"
      }
      wsConfig {
        ssl.loose.acceptAnyCertificate = true
      }
    }
  ]
}
