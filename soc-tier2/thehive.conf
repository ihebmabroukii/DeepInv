## Play Framework Secret
play.http.secret.key="changeme_thehive_secret_key_production_CHANGE_THIS_IN_REAL_DEPLOYMENT"

## Database Configuration
db {
  provider: janusgraph
  janusgraph {
    storage {
      backend: cql
      hostname: ["cassandra"]
      cql {
        cluster-name: thp
        keyspace: thehive
      }
    }
    index.search {
      backend: elasticsearch
      hostname: ["thehive-elasticsearch"]
      index-name: thehive
    }
  }
}

## Storage configuration
storage {
  provider: localfs
  localfs.location: /opt/thp/thehive/data
}

## Attachment storage
attachment.storage: localfs

## Service configuration
application.baseUrl: "http://localhost:9000"

