version: '3'
services:
  # Cortex Elasticsearch (existing)
  cortex-elasticsearch:
    image: elasticsearch:7.17.15
    container_name: cortex-elasticsearch
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - cortex-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - soc-tier2-net
    restart: unless-stopped

  # TheHive Elasticsearch (new)
  thehive-elasticsearch:
    image: elasticsearch:7.17.15
    container_name: thehive-elasticsearch
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - thehive-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - soc-tier2-net
    restart: unless-stopped

  # Cassandra database for TheHive
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=thp
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - soc-tier2-net
    restart: unless-stopped

  # Cortex (existing, updated network)
  cortex:
    image: thehiveproject/cortex:3.1.7
    container_name: cortex
    depends_on:
      - cortex-elasticsearch
    ports:
      - "9001:9001"
    volumes:
      - ./application.conf:/etc/cortex/application.conf
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - soc-tier2-net
    restart: unless-stopped

  # TheHive (new)
  thehive:
    image: strangebee/thehive:5.5
    container_name: thehive
    depends_on:
      - cassandra
      - thehive-elasticsearch
    ports:
      - "9000:9000"
    volumes:
      - ./thehive.conf:/etc/thehive/application.conf
      - thehive-data:/opt/thp/thehive/data
    environment:
      - JVM_OPTS=-Xms1g -Xmx1g
    networks:
      - soc-tier2-net
    restart: unless-stopped
    command: "--no-config-secret"

  # MariaDB for MISP
  misp-db:
    image: mariadb:10.11
    container_name: misp-db
    environment:
      - MYSQL_ROOT_PASSWORD=MispRootPass2026!
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=MispDbPass2026!
    volumes:
      - misp-db-data:/var/lib/mysql
    networks:
      - soc-tier2-net
    restart: unless-stopped

  # Redis for MISP
  misp-redis:
    image: redis:7.2-alpine
    container_name: misp-redis
    volumes:
      - misp-redis-data:/data
    networks:
      - soc-tier2-net
    restart: unless-stopped

  # MISP Platform
  misp:
    image: coolacid/misp-docker:core-latest
    container_name: misp
    depends_on:
      - misp-db
      - misp-redis
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - MYSQL_HOST=misp-db
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=MispDbPass2026!
      - REDIS_FQDN=misp-redis
      - MISP_BASEURL=http://localhost:8080
      - TIMEZONE=Europe/Brussels
      - ADMIN_EMAIL=admin@misp.local
      - ADMIN_PASSWORD=MispAdmin2026!
      - ADMIN_ORG=SOC-Tier2
    volumes:
      - misp-data:/var/www/MISP
    networks:
      - soc-tier2-net
    restart: unless-stopped

networks:
  soc-tier2-net:
    driver: bridge

volumes:
  cortex-elasticsearch-data:
  thehive-elasticsearch-data:
  cassandra-data:
  thehive-data:
  misp-db-data:
  misp-redis-data:
  misp-data:
