version: '3'
services:
  # Cortex Elasticsearch (existing)
  cortex-elasticsearch:
    image: elasticsearch:7.17.15
    container_name: cortex-elasticsearch
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - cortex-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - soc-tier2-net
    restart: unless-stopped

  # TheHive Elasticsearch (new)
  thehive-elasticsearch:
    image: elasticsearch:7.17.15
    container_name: thehive-elasticsearch
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - thehive-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - soc-tier2-net
    restart: unless-stopped

  # Cassandra database for TheHive
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=thp
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - soc-tier2-net
    restart: unless-stopped

  # Cortex (existing, updated network)
  cortex:
    image: thehiveproject/cortex:3.1.7
    container_name: cortex
    depends_on:
      - cortex-elasticsearch
    ports:
      - "9001:9001"
    volumes:
      - ./application.conf:/etc/cortex/application.conf
      - /var/run/docker.sock:/var/run/docker.sock
      - ./analyzers:/opt/cortex/analyzers
    networks:
      - soc-tier2-net
    restart: unless-stopped

  # TheHive (new)
  thehive:
    image: strangebee/thehive:5.5
    container_name: thehive
    depends_on:
      - cassandra
      - thehive-elasticsearch
    ports:
      - "9000:9000"
    volumes:
      - ./thehive.conf:/etc/thehive/application.conf
      - thehive-data:/opt/thp/thehive/data
    environment:
      - JVM_OPTS=-Xms1g -Xmx1g
    networks:
      - soc-tier2-net
    restart: unless-stopped
    command: "--no-config-secret"

  # OpenCTI Stack
  opencti-elasticsearch:
    image: elasticsearch:8.12.0
    volumes:
      - opencti-elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    restart: always
    networks:
      - soc-tier2-net

  opencti-redis:
    image: redis:7.2
    restart: always
    networks:
      - soc-tier2-net

  opencti-minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    volumes:
      - opencti-minio-data:/data
    ports:
      - "9002:9000"
      - "9003:9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9090"
    restart: always
    networks:
      - soc-tier2-net

  opencti-rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    restart: always
    networks:
      - soc-tier2-net

  opencti:
    image: opencti/platform:latest
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN}
      - APP__APP_LOGS__LOGS_LEVEL=info
      - APP__BASE_URL=${OPENCTI_BASE_URL}
      - APP__HOST=0.0.0.0
      - APP__PORT=8080
      - APP__CORS__ALLOW_ORIGINS=*
      - REDIS__HOSTNAME=opencti-redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://opencti-elasticsearch:9200
      - MINIO__ENDPOINT=opencti-minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - RABBITMQ__HOSTNAME=opencti-rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__PORT_MANAGEMENT=15672
      - RABBITMQ__MANAGEMENT_SSL=false
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - PROVIDERS__LOCAL__STRATEGY=LocalStrategy
    ports:
      - "127.0.0.1:8888:8080"
    depends_on:
      - opencti-redis
      - opencti-rabbitmq
      - opencti-elasticsearch
      - opencti-minio
    restart: always
    networks:
      - soc-tier2-net

  opencti-worker:
    image: opencti/worker:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - WORKER_ID=${WORKER_ID}
      - WORKER_LOG_LEVEL=error
    depends_on:
      - opencti
    deploy:
      mode: replicated
      replicas: 1
    restart: always
    networks:
      - soc-tier2-net

  opencti-connector-history:
    image: opencti/connector-history:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_HISTORY_ID}
      - CONNECTOR_TYPE=INTERNAL_ENRICHMENT
      - CONNECTOR_NAME=History
      - CONNECTOR_SCOPE=history
      - CONNECTOR_AUTO=true
      - CONNECTOR_CONFIDENCE_LEVEL=100
      - CONNECTOR_LOG_LEVEL=error
    depends_on:
      - opencti
    restart: always
    networks:
      - soc-tier2-net

  opencti-connector-export-file-stix:
    image: opencti/connector-export-file-stix:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_STIX_ID}
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileStix2
      - CONNECTOR_SCOPE=application/json
      - CONNECTOR_CONFIDENCE_LEVEL=15
      - CONNECTOR_LOG_LEVEL=error
    depends_on:
      - opencti
    restart: always
    networks:
      - soc-tier2-net

  opencti-connector-export-file-csv:
    image: opencti/connector-export-file-csv:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_CSV_ID}
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileCsv
      - CONNECTOR_SCOPE=text/csv
      - CONNECTOR_CONFIDENCE_LEVEL=15
      - CONNECTOR_LOG_LEVEL=error
    depends_on:
      - opencti
    restart: always
    networks:
      - soc-tier2-net

  opencti-connector-export-file-txt:
    image: opencti/connector-export-file-txt:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_TXT_ID}
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileTxt
      - CONNECTOR_SCOPE=text/plain
      - CONNECTOR_CONFIDENCE_LEVEL=15
      - CONNECTOR_LOG_LEVEL=error
    depends_on:
      - opencti
    restart: always
    networks:
      - soc-tier2-net

networks:
  soc-tier2-net:
    driver: bridge

volumes:
  cortex-elasticsearch-data:
  thehive-elasticsearch-data:
  cassandra-data:
  thehive-data:
  opencti-elasticsearch-data:
  opencti-minio-data:
