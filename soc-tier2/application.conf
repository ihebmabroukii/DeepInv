## Secret key
# Play uses a secret key for a number of things, including signing session cookies.
# This key should be kept secret.
play.http.secret.key="loremipsumdolorsitametconsecteturadipiscingelit"

## Elasticsearch
search {
  index = "cortex"
  uri = "http://cortex-elasticsearch:9200"
}

## Analyzers and Responders
# Initial activation of analyzers and responders
analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json"
  ]
}

responder {
  urls = [
    "https://download.thehive-project.org/responders.json"
  ]
}

## Job Runners
job {
  runner = ["docker"]
}

## Docker Worker Configuration
docker {
  container {
    # This forces every new analyzer container to join your SOC network
    networkMode = "soc-tier2_soc-tier2-net"
  }
}
