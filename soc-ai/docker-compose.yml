services:
  soc-ai:
    build: .
    container_name: soc-ai
    user: "0:0"
    restart: always
    ports:
      - "8001:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - WAZUH_API_URL=https://wazuh.manager:55000
      - WAZUH_API_USER=${WAZUH_API_USER:?set in .env}
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD:?set in .env}
      - SURICATA_LOG_PATH=/var/log/suricata/eve.json
      - THEHIVE_URL=http://thehive:9000
      - THEHIVE_PUBLIC_URL=http://localhost:9000
      - THEHIVE_API_KEY=${THEHIVE_API_KEY:-}
      - REDIS_URL=redis://soc-ai-redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - AI_MODEL_NAME=mistral:latest
      # Dynamic Hostname (DNS Verified)
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_TOKEN:?set in .env}
      # Cortex: reachable via docker hostname; PUBLIC_URL is for browser links
      - CORTEX_URL=http://cortex:9001
      - CORTEX_PUBLIC_URL=http://localhost:9001
      - CORTEX_API_KEY=${CORTEX_API_KEY:?set in .env}

      # Security Onion Elasticsearch Polling
      - SO_ELASTIC_URL=${SO_ELASTIC_URL:-https://security-onion.local:9200}
      - SO_ELASTIC_USER=${SO_ELASTIC_USER:-so_elastic}
      - SO_ELASTIC_PASS=${SO_ELASTIC_PASS:?set in .env}
    volumes:
      - soc-tier1_suricata-logs:/var/log/suricata:ro
      - soc-tier1_wazuh-logs:/var/ossec/logs:ro
      - ./logs:/app/logs
      - ./app:/app/app
      - ./playbooks:/app/playbooks
    networks:
      - soc_net
    depends_on:
      - ollama
      - redis

  celery_worker:
    build: .
    container_name: soc-ai-celery
    command: celery -A app.worker.celery_app worker --loglevel=info
    user: "0:0"
    restart: always
    environment:
      - REDIS_URL=redis://soc-ai-redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - AI_MODEL_NAME=mistral:latest
      - WAZUH_API_URL=https://wazuh.manager:55000
      - WAZUH_API_USER=${WAZUH_API_USER:?set in .env}
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD:?set in .env}
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_TOKEN:?set in .env}

      # Security Onion Elasticsearch Polling
      - SO_ELASTIC_URL=${SO_ELASTIC_URL:-https://security-onion.local:9200}
      - SO_ELASTIC_USER=${SO_ELASTIC_USER:-so_elastic}
      - SO_ELASTIC_PASS=${SO_ELASTIC_PASS:?set in .env}
    networks:
      - soc_net
    volumes:
      - ./app:/app/app
      - ./playbooks:/app/playbooks
    depends_on:
      - redis
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    networks:
      - soc_net
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  redis:
    image: redis/redis-stack-server:latest
    container_name: soc-ai-redis
    networks:
      - soc_net
    ports:
      - "6379:6379"
    command: redis-stack-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always

# Connect to the existing network defined in Tier 1 / Tier 2
networks:
  soc_net:
    external: true
    name: soc-tier2_soc-tier2-net

volumes:
  soc-tier1_suricata-logs:
    external: true
  soc-tier1_wazuh-logs:
    external: true
  ollama_data:
  redis_data:
