version: '3.8'

services:
  soc-ai:
    build: .
    container_name: soc-ai
    user: "0:0"
    restart: always
    ports:
      - "8001:8000"
    command: /bin/bash -c "pip install celery redis pydantic && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - WAZUH_API_URL=https://wazuh.manager:55000
      - WAZUH_API_USER=wazuh
      - WAZUH_API_PASSWORD=wazuh
      - SURICATA_LOG_PATH=/var/log/suricata/eve.json
      - THEHIVE_URL=http://thehive:9000
      - REDIS_URL=redis://soc-ai-redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - AI_MODEL_NAME=mistral
      # Dynamic Hostname (DNS Verified)
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=REDACTED
    volumes:
      - soc-tier1_suricata-logs:/var/log/suricata:ro
      - soc-tier1_wazuh-logs:/var/ossec/logs:ro
      - ./logs:/app/logs
      - ./app:/app/app
    networks:
      - soc_net
    depends_on:
      - ollama
      - redis

  celery_worker:
    build: .
    container_name: soc-ai-celery
    command: /bin/bash -c "pip install celery redis pydantic && celery -A app.worker.celery_app worker --loglevel=info"
    user: "0:0"
    restart: always
    environment:
      - REDIS_URL=redis://soc-ai-redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - AI_MODEL_NAME=mistral
      - WAZUH_API_URL=https://wazuh.manager:55000
      - WAZUH_API_USER=wazuh
      - WAZUH_API_PASSWORD=wazuh
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=REDACTED
    networks:
      - soc_net
    volumes:
      - ./app:/app/app
    depends_on:
      - redis
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:
      - soc_net
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  redis:
    image: redis/redis-stack-server:latest
    container_name: soc-ai-redis
    networks:
      - soc_net
    ports:
      - "6379:6379"
    restart: always

# Connect to the existing network defined in Tier 1 / Tier 2
networks:
  soc_net:
    external: true
    name: soc-tier2_soc-tier2-net

volumes:
  soc-tier1_suricata-logs:
    external: true
  soc-tier1_wazuh-logs:
    external: true
  ollama_data:
